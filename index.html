<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="بازی آنلاین اسم فامیل؛ با دوستانت رقابت کن!">
<meta name="theme-color" content="#FFF5E6">
<title>اسم فامیل | بازی آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit}
:root{--coral:#FF5C7A;--teal:#14B8A6;--purple:#7C5CFF;--yellow:#FFC857;--mint:#7EE0C3;--blue:#4C8DFF;--onc:#1b1a33;--r:22px;--ease:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 18px 28px;position:relative;overflow-x:hidden;line-height:1.7;transition:background .4s,color .3s}
body::before,body::after{content:'';position:fixed;z-index:-1;width:380px;height:380px;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
body::before{top:-140px;right:-120px;background:var(--b1)}
body::after{bottom:-160px;left:-140px;background:var(--b2)}
body[data-theme=day]{--bg:#F6F3FF;--paper:#fff;--ink:#1b1a33;--soft:#F0EDFB;--muted:#6f6c8f;--line:rgba(27,26,51,.09);--sh:0 12px 32px -14px rgba(76,50,160,.32);--b1:#c9b8ff;--b2:#ffd1dc}
body[data-theme=night]{--bg:#0d0d21;--paper:#18183a;--ink:#f3f2ff;--soft:#242450;--muted:#a3a2cf;--line:rgba(255,255,255,.1);--sh:0 14px 34px -14px rgba(0,0,0,.8);--b1:#4b2fd0;--b2:#0e7f8f}
body[data-theme=sunset]{--bg:#FFEBDD;--paper:#FFFAF6;--ink:#3b1d2a;--soft:#FFEEE2;--muted:#7a5a66;--line:rgba(59,29,42,.1);--sh:0 12px 32px -14px rgba(180,70,60,.35);--b1:#ffb199;--b2:#ffd98a}
body[data-theme=forest]{--bg:#E6F4E4;--paper:#FAFFF8;--ink:#17301f;--soft:#EAF6E7;--muted:#52705a;--line:rgba(23,48,31,.1);--sh:0 12px 32px -14px rgba(30,100,60,.35);--b1:#9be3b0;--b2:#c2e9ff}
body.hasnav{padding-bottom:116px}
.container{max-width:500px;margin:0 auto}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.page{display:none}
.page.active{display:block;animation:fadeIn .45s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
/* header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--purple));border:3px solid var(--paper);display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 0 0 2px var(--purple),var(--sh);cursor:pointer;overflow:hidden;color:#fff;transition:transform .2s var(--ease)}
.avatar:active{transform:scale(.92)}
.avatar img{width:100%;height:100%;object-fit:cover}
.logo{font-size:1.75rem;font-weight:900;display:flex;gap:8px;align-items:center}
.logo span:last-child{background:linear-gradient(120deg,var(--coral),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:50px;height:50px;border-radius:16px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh);font-size:1.3rem;cursor:pointer;color:var(--ink);transition:transform .15s}
.icon-btn:active{transform:scale(.92) rotate(20deg)}
.welcome h1{font-size:1.65rem;font-weight:900;letter-spacing:-.3px}
.welcome p{color:var(--muted);margin:2px 0 18px}
.statbar{display:flex;gap:10px;margin-bottom:22px}
.stat-chip{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:var(--sh);font-size:.95rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat-chip.lv{flex:1;flex-direction:column;align-items:stretch;gap:6px}
.xpbar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--blue),var(--purple));transition:width .8s var(--ease)}
/* buttons */
.main-btn{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r);border:1px solid rgba(255,255,255,.5);box-shadow:var(--sh);margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden;color:var(--onc);transition:transform .2s var(--ease),box-shadow .2s;width:100%;text-align:right;font-family:inherit}
.main-btn::after{content:'‹';position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:1.8rem;opacity:.45;font-weight:900}
.main-btn:active{transform:scale(.97)}
.main-btn .icon{width:58px;height:58px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.main-btn .title{font-size:1.28rem;font-weight:900}
.main-btn .desc{font-size:.88rem;opacity:.78}
.main-btn.black{background:linear-gradient(135deg,#2a2370,#6a3df0);color:#fff;border-color:transparent}
.main-btn.black .icon{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.main-btn.yellow{background:linear-gradient(135deg,#FFE29A,#FFC857)}
.main-btn.mint{background:linear-gradient(135deg,#B8F2DF,#7EE0C3)}
.main-btn.purple{background:linear-gradient(135deg,#EBDDFF,#CDB6FF)}
.main-btn.blue{background:linear-gradient(135deg,#CFE4FF,#9CC6FF)}
.main-btn.coral{background:linear-gradient(135deg,#FF8CA3,#FF5C7A);color:#fff}
.main-btn.disabled{opacity:.55;filter:grayscale(.45)}
.badge{position:absolute;top:10px;left:12px;background:var(--coral);color:#fff;padding:2px 11px;border-radius:20px;font-size:.7rem;font-weight:900;box-shadow:0 4px 10px -2px rgba(255,92,122,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border:1px solid var(--line);border-radius:16px;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:var(--sh);color:var(--ink);background:var(--paper);transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.04)}
.btn.block{width:100%}.btn.sm{padding:8px 13px;font-size:.88rem;border-radius:13px}
.btn.coral{background:linear-gradient(135deg,#FF8CA3,#FF5C7A);color:#fff;border-color:transparent}
.btn.teal{background:linear-gradient(135deg,#2DD4BF,#0EA5A0);color:#fff;border-color:transparent}
.btn.yellow{background:linear-gradient(135deg,#FFE29A,#FFC857);color:var(--onc);border-color:transparent}
.btn.mint{background:linear-gradient(135deg,#B8F2DF,#7EE0C3);color:var(--onc);border-color:transparent}
.btn.blue{background:linear-gradient(135deg,#CFE4FF,#8DBBFF);color:var(--onc);border-color:transparent}
.btn.purple{background:linear-gradient(135deg,#EBDDFF,#C9B0FF);color:var(--onc);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn:disabled,.btn.off{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.row2{display:flex;gap:10px;margin:10px 0}.row2>*{flex:1}
.back-btn{background:var(--paper);border:1px solid var(--line);border-radius:50px;padding:8px 18px;font-weight:900;cursor:pointer;display:inline-flex;gap:8px;box-shadow:var(--sh);margin-bottom:18px;color:var(--ink);transition:transform .15s}
.back-btn:active{transform:scale(.95)}
/* cards */
.section-box,.online-card,.cat-card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.section-title{font-size:1.25rem;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.online-card h2{font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:10px}
.mut{color:var(--muted);font-size:.9rem}.empty{text-align:center;color:var(--muted);padding:16px}
.input-field{width:100%;padding:14px;background:var(--soft);border:2px solid transparent;border-radius:16px;font-size:1rem;font-weight:700;outline:none;margin-bottom:12px;text-align:center;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.input-field:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
select.input-field{appearance:none;margin-bottom:0}
.room-code-display{background:linear-gradient(135deg,#FFE29A,#FFC857);color:var(--onc);border-radius:18px;padding:12px;text-align:center;font-size:2.2rem;font-weight:900;font-family:ui-monospace,Menlo,monospace;letter-spacing:8px;margin:12px 0;cursor:pointer;direction:ltr;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.hint-box{background:rgba(255,200,87,.2);border:1px dashed var(--yellow);border-radius:16px;padding:12px;font-size:.88rem;margin-bottom:14px;line-height:1.9}
.wait{text-align:center;color:var(--muted);font-weight:700;padding:14px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:var(--soft);font-weight:700;font-size:.9rem;cursor:pointer;user-select:none;transition:all .2s var(--ease)}
.chip:active{transform:scale(.93)}
.chip.on{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border-color:transparent;box-shadow:0 6px 14px -6px rgba(124,92,255,.7)}
/* players */
.player-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;margin-bottom:8px;background:var(--soft)}
.pav{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.pinfo{flex:1}.pinfo small{display:block;color:var(--teal);font-weight:700}.pinfo small.off{color:var(--muted)}
.kick{border:0;background:var(--coral);color:#fff;width:32px;height:32px;border-radius:50%;font-weight:900;cursor:pointer}
/* game */
.game-header{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.game-letter{width:64px;height:64px;background:linear-gradient(135deg,#FFE29A,#FF9F5A);color:var(--onc);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2.3rem;font-weight:900;box-shadow:0 10px 20px -8px rgba(255,140,60,.7);animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.game-timer{min-width:64px;height:48px;background:var(--soft);border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:900;padding:0 14px;font-variant-numeric:tabular-nums}
.game-timer.danger{background:var(--coral);color:#fff;animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.powerups{display:flex;gap:10px;margin-bottom:14px}
.powerup-btn{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:9px 4px;text-align:center;cursor:pointer;box-shadow:var(--sh);font-weight:700;font-size:.78rem;color:var(--ink);transition:transform .15s}
.powerup-btn:active{transform:scale(.94)}
.powerup-btn .p-icon{font-size:1.4rem;display:block}
.powerup-btn .p-count{background:var(--purple);color:#fff;padding:1px 9px;border-radius:10px;font-size:.75rem}
.powerup-btn.disabled{opacity:.4}
.notebook{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:12px;box-shadow:var(--sh);margin-bottom:14px}
.game-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.game-table td{padding:3px}.game-table td:first-child{width:36%}
.cat-cell{display:flex;align-items:center;gap:6px;padding:12px 10px;font-weight:900;font-size:.92rem;background:var(--soft);border-radius:14px}
.game-table input{width:100%;padding:13px 8px;background:var(--soft);border:2px solid transparent;border-radius:14px;font-size:1.02rem;font-weight:700;text-align:center;outline:none;color:var(--ink);transition:all .2s}
.game-table input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(124,92,255,.18);background:var(--paper)}
.game-table input.correct{border-color:var(--teal);background:#D6F7EE;color:#0b3d36}
.game-table input.wrong{border-color:var(--coral);background:#FFE3E8;color:#5a1020}
.game-table input.same{border-color:var(--yellow);background:#FFF3CF;color:#4a3500}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,#2DD4BF,#0EA5A0);border:0;border-radius:20px;font-size:1.2rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 14px 24px -12px rgba(14,165,160,.8);margin-bottom:10px;transition:transform .15s}
.submit-btn:active{transform:scale(.97)}
.submit-btn.stop{background:linear-gradient(135deg,#FF8CA3,#FF5C7A);box-shadow:0 14px 24px -12px rgba(255,92,122,.8)}
.submit-btn.ghost{background:var(--paper);color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line)}
.submit-btn:disabled{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.stopbanner{min-height:24px;text-align:center;font-weight:900;color:var(--coral);margin-bottom:8px}
/* board */
.cat-title{font-weight:900;font-size:1.08rem;margin-bottom:8px}
.ans-row{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line)}
.ans-row:last-child{border:0}
.ans-row .an{width:30%;font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans-row .av{flex:1;font-weight:900}
.ans-row .ap{background:linear-gradient(135deg,#2DD4BF,#0EA5A0);color:#fff;border-radius:10px;padding:1px 10px;font-weight:900;font-size:.85rem}
.ans-row .ap.z{background:var(--coral)}
.ans-row.rej .av{text-decoration:line-through;opacity:.5}
.flag{border:0;background:var(--soft);border-radius:10px;width:36px;height:32px;cursor:pointer;filter:grayscale(1);opacity:.6;transition:all .2s}
.flag.on{background:var(--coral);filter:none;opacity:1}
.rank{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:18px;background:var(--soft);margin-bottom:8px}
.rank.first{background:linear-gradient(135deg,#FFE29A,#FFC857);color:var(--onc);box-shadow:0 10px 20px -10px rgba(255,170,40,.8)}
.rank b{margin-right:auto;font-size:1.15rem}
.big-emoji{font-size:3.6rem;text-align:center;animation:pop .6s var(--ease)}
.final-title{text-align:center;font-size:1.75rem;font-weight:900;margin-bottom:4px}
/* profile / store */
.profile-card{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:24px 18px;box-shadow:var(--sh);margin-bottom:18px}
.avatar-lg{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--purple));border:4px solid var(--paper);box-shadow:0 0 0 3px var(--purple),var(--sh);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:3.1rem;cursor:pointer;position:relative;color:#fff}
.avatar-lg img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.camera-icon{position:absolute;bottom:-2px;right:-2px;background:var(--yellow);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--paper);font-size:1rem}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.emoji-grid span{font-size:1.5rem;padding:7px 0;border-radius:14px;cursor:pointer;background:var(--soft);transition:transform .15s}
.emoji-grid span:active{transform:scale(.88)}
.emoji-grid span.sel{background:linear-gradient(135deg,#FFE29A,#FFC857);box-shadow:0 6px 14px -6px rgba(255,170,40,.9)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat-box{background:var(--soft);border-radius:18px;padding:12px 6px}
.stat-num{font-size:1.55rem;font-weight:900;color:var(--purple)}.stat-label{font-size:.78rem;color:var(--muted)}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.store-item{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:18px 10px;text-align:center;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.store-item:active{transform:scale(.95)}
.store-item:hover{box-shadow:var(--sh)}
.item-icon{font-size:2.4rem}.item-name{font-weight:900;margin:4px 0}.item-price{color:var(--purple);font-weight:800;font-size:.88rem}
.store-item.owned{background:linear-gradient(135deg,rgba(124,92,255,.14),rgba(20,184,166,.14))}
.coins-box{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px;background:linear-gradient(135deg,#FFE29A,#FFC857);color:var(--onc);border-radius:20px;font-size:1.6rem;font-weight:900}
.ach{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);opacity:.6;filter:grayscale(.5)}
.ach.unlocked{opacity:1;filter:none;background:linear-gradient(135deg,rgba(255,200,87,.2),var(--paper))}
.ach .ai{font-size:2.3rem}.ach .info{flex:1}.ach b{display:block}.ach small{color:var(--muted)}
.fcard{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:12px;margin-bottom:10px}
.fcard .info{flex:1}.fcard small{display:block;color:var(--teal);font-weight:700}.fcard small.off{color:var(--muted)}
.mycode{background:linear-gradient(135deg,#FFE29A,#FFC857);color:var(--onc);border-radius:18px;padding:12px;text-align:center;font-size:1.6rem;font-weight:900;font-family:ui-monospace,Menlo,monospace;letter-spacing:6px;margin:12px 0;direction:ltr;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--soft);padding:5px;border-radius:20px}.tabs .btn{flex:1;box-shadow:none;background:transparent;border:0}.tabs .btn.act{background:var(--paper);box-shadow:var(--sh)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--soft);border-radius:18px;margin:10px 0}
.setting-row .nm{font-weight:900}
.setting-row input[type=range]{width:120px;accent-color:var(--purple)}
.setting-row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:var(--muted);opacity:.5;position:relative;cursor:pointer;transition:all .25s}
.setting-row input[type=checkbox]::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.setting-row input[type=checkbox]:checked{background:var(--teal);opacity:1}
.setting-row input[type=checkbox]:checked::after{transform:translateX(-20px)}
.stepper{display:flex;align-items:center;gap:8px}.stepper b{min-width:72px;text-align:center}
/* nav + overlays */
.bottom-nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:476px;display:none;background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 40px -12px rgba(40,20,100,.35);z-index:50;padding:4px}
body.hasnav .bottom-nav{display:flex}
.nav-item{flex:1;text-align:center;padding:8px 0 6px;font-size:.7rem;font-weight:900;cursor:pointer;color:var(--muted);border-radius:22px;transition:all .25s var(--ease)}
.nav-item .ni{display:block;font-size:1.35rem;transition:transform .25s var(--ease)}
.nav-item.active{color:var(--ink);background:var(--soft)}
.nav-item.active .ni{transform:translateY(-2px) scale(1.15)}
.modal{display:none;position:fixed;inset:0;background:rgba(10,8,30,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;padding:18px}
.modal.active{display:flex;animation:fadeOnly .25s}
@keyframes fadeOnly{from{opacity:0}}
.modal-content{background:var(--paper);color:var(--ink);border-radius:28px;padding:24px;max-width:440px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);max-height:88vh;overflow-y:auto;text-align:center;animation:fadeIn .35s var(--ease)}

/* ================= SOUND ================= */
let AC;
function tone(f,d=.12,type='sine',v=.2,t0=0){
  if(!S.sfx)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    const vol=v*(S.vol/100),t=AC.currentTime+t0;
    g.gain.setValueAtTime(Math.max(vol,.0002),t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

  const c=$('#confetti'),cols=['#FF6B6B','#4ECDC4','#FFD93D','#9B59B6','#95E1D3','#4A90E2'];
  for(let i=0;i<60;i++){const s=document.createElement('i');

}

  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('📋 کپی شد!')).catch(()=>{
    const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('📋 کپی شد!');}catch(e){}a.remove();});

];
function addXP(n){
  P.xp+=n;
  while(P.xp>=P.level*100){P.xp-=P.level*100;P.level++;P.coins+=20*P.level;toast('🎉 سطح '+fa(P.level)+' شدی!');confetti();SFX.win();}
}
function checkAch(){
  ACH.forEach(a=>{if(a.f(P)&&!P.seen[a.id]){P.seen[a.id]=1;toast('🏅 دست‌آورد جدید: '+a.n);}});
  saveP();
}
function applyStats({score,win,online,extra}){
  P.games++;P.score+=score;P.best=Math.max(P.best,score);
  if(win){P.wins++;if(online)P.onlineWins++;}
  const coins=Math.floor(score/4)+(win?30:0)+(extra||0);
  P.coins+=coins;
  addXP(Math.floor(score/2)+10+(win?25:0));
  saveP();pushLB(score);checkAch();
  return coins;
}

const HIDENAV=['room','game','board','final','online'];
const RENDER={};
function go(p,push=true){
  if(G&&G.active&&G.mode!=='online'&&p!=='game'){return ask('بازی نیمه‌کاره می‌مونه. خارج شی؟',()=>{G.active=false;go(p,push);});}
  $$('.page').forEach(x=>x.classList.remove('active'));
  const el=$('#p-'+p);if(el)el.classList.add('active');
  document.body.classList.toggle('hasnav',!HIDENAV.includes(p));
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.p===p));
  if(RENDER[p])RENDER[p]();
  window.scrollTo(0,0);
  if(push&&!['room','game','board','final'].includes(p))history.pushState({p},'');
}
const show=p=>go(p,false);
window.addEventListener('popstate',e=>{
  if(G&&G.active){history.pushState({p:'game'},'');return ask('از بازی خارج شی؟',quitGame);}
  go((e.state&&e.state.p)||'home',false);
});
function quitGame(){
  if(G&&G.mode==='online'){leaveRoom();return;}
  if(G)G.active=false;G=null;go('home');
}
/* ================= FIREBASE ================= */
function initFirebase(){
  try{
    if(typeof firebase==='undefined')return;
    firebase.initializeApp(CFG);db=firebase.database();
    db.ref('.info/serverTimeOffset').on('value',s=>serverOffset=s.val()||0);
    db.ref('.info/connected').on('value',s=>{
      fbOK=s.val()===true;updConn();
      if(fbOK){
        const ref=db.ref('users/'+P.id);
        ref.onDisconnect().update({on:false,seen:firebase.database.ServerValue.TIMESTAMP});
        pushProfile();
        if(!didInit){didInit=true;if(pendingJoin)joinRoom(pendingJoin);else resumeRoom();}
      }
    });
    setInterval(pushProfile,45000);
  }catch(e){console.warn(e);}
}
function pushProfile(){
  if(!fbOK)return;
  db.ref('users/'+P.id).update({n:P.name,e:P.emoji,lv:P.level,s:P.score,on:true,seen:firebase.database.ServerValue.TIMESTAMP});
}
function updConn(){const el=$('#conn');if(el)el.innerHTML=fbOK?'🟢 متصل به سرور':'🔴 اتصال برقرار نیست';}
function needFB(quiet){
  return new Promise(res=>{
    if(!db){if(!quiet)toast('Firebase در دسترس نیست؛ اینترنت را بررسی کن');return res(false);}
    if(fbOK)return res(true);
    let t=0;const iv=setInterval(()=>{
      if(fbOK){clearInterval(iv);res(true);}
      else if(++t>20){clearInterval(iv);if(!quiet)toast('اتصال به سرور برقرار نشد');res(false);}
    },200);
  });
}
async function fetchLB(kind){
  const path=kind==='week'?'lb/w'+weekKey():'lb/all';
  const snap=await db.ref(path).orderByChild('s').limitToLast(20).once('value');
  const a=[];snap.forEach(c=>{a.push(Object.assign({id:c.key},c.val()));});
  return a.reverse();
}
function pushLB(gain){
  if(!fbOK||gain<=0)return;
  const base={n:P.name,e:P.emoji,lv:P.level};
  ['lb/all/'+P.id,'lb/w'+weekKey()+'/'+P.id].forEach(path=>
    db.ref(path).transaction(c=>Object.assign({},base,{s:((c&&c.s)||0)+gain})));
}

function uploadAvatar(inp){
  const f=inp.files&&inp.files[0];if(!f)return;

  fr.onload=e=>{img.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=96;
    const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
    c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,96,96);
    P.photo=c.toDataURL('image/jpeg',.8);saveP();toast('✅ عکس تغییر کرد');RENDER.profile();
  };img.src=e.target.result;};
  fr.readAsDataURL(f);
}

function claimGift(){
  if(P.gift===today())return;
  P.gift=today();const c=20+Math.min(P.streak,10)*5;P.coins+=c;saveP();SFX.ok();toast('🎁 '+fa(c)+' سکه گرفتی!');RENDER.store();checkAch();
}
function setTheme(t){P.theme=t;saveP();applyTheme();RENDER.store();}
function buy(id){
  const it=STORE.find(x=>x.id===id);
  if(it.t==='theme'&&P.owned[id])return setTheme(it.th);
  if(it.t!=='pw'&&P.owned[id])return toast('این رو داری!');
  if(P.coins<it.p){SFX.bad();return toast('سکه کافی نداری!');}
  P.coins-=it.p;
  if(it.t==='pw')P.inv[it.k]+=it.c;else P.owned[id]=1;
  if(it.t==='theme'){P.theme=it.th;applyTheme();}
  saveP();SFX.ok();toast('✅ '+it.n+' خریداری شد!');RENDER.store();checkAch();
}

        :`<button class="submit-btn stop" id="stopBtn" disabled onclick="doStop()">✋ استپ!</button><div class="mut" style="text-align:center">وقتی همهٔ خانه‌ها با حرف «${G.letter}» پر شد، می‌تونی استپ بزنی.</div>`}`;

function updPower(){
  ['hint','time','skip'].forEach(k=>{const el=$('#pw-'+k);if(!el)return;el.querySelector('.p-count').textContent=fa(P.inv[k]);el.classList.toggle('disabled',P.inv[k]<=0);});

function usePower(k){
  if(!G||!G.active||G.mode==='online')return;
  if(P.inv[k]<=0){toast('تموم شده! از فروشگاه بخر');return;}
  if(k==='hint'){
    const i=G.cats.findIndex((c,i)=>!G.hidden.has(i)&&!$('#in-'+i).value.trim()&&dictWords(c,G.letter).length);
    if(i<0){toast('برای خانه‌های خالی راهنمایی ندارم');return;}
    const w=rnd(dictWords(G.cats[i],G.letter)),el=$('#in-'+i);el.placeholder='💡 '+w.slice(0,2)+'…';el.focus();
  }else if(k==='time'){G.endAt+=15000;toast('⏱️ ۱۵ ثانیه اضافه شد');}
  else if(k==='skip'){
    const vis=G.cats.map((c,i)=>i).filter(i=>!G.hidden.has(i));
    if(vis.length<=3){toast('حداقل ۳ دسته باید بماند');return;}

/* ================= SOLO / DAILY ================= */
function dailyLetter(){let h=0;const s=today();for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return LETTERS[h%LETTERS.length];}
function startSolo(mode){
  if(mode==='daily'&&P.lastDaily===today())return toast('امروز چالش رو انجام دادی؛ فردا دوباره بیا!');
  G={mode,round:1,total:mode==='daily'?1:S.rounds,used:[],cats:S.cats.slice(),me:0,bot:[0,0],active:false,perfect:0,hidden:new Set()};
  soloRound();
}
function soloRound(){
  if(G.mode==='daily')G.letter=dailyLetter();
  else{const pool=LETTERS.filter(l=>!G.used.includes(l));G.letter=rnd(pool.length?pool:LETTERS);G.used.push(G.letter);}
  G.hidden=new Set();G.endAt=Date.now()+(G.mode==='daily'?60:S.time)*1000;G.active=true;G.lastLeft=-1;
  drawGame();show('game');
}
function submitSolo(){
  if(!G||!G.active||G.mode==='online')return;
  G.active=false;
  const L=G.letter,left=Math.max(0,Math.ceil((G.endAt-Date.now())/1000));
  const bots=BOTS.map(n=>({n,a:{}})),rows=[];
  let pts=0,valids=0,vis=0;
  G.cats.forEach((c,i)=>{
    if(G.hidden.has(i))return;vis++;
    const inp=$('#in-'+i),a=norm(inp.value),dw=dictWords(c,L);
    bots.forEach(b=>{b.a[i]=dw.length&&Math.random()<.7?rnd(dw):'';});
    const same=bots.some(b=>b.a[i]&&norm(b.a[i])===a);
    let s=0,st='bad';
    if(valid(a,L)){valids++;const known=dw.map(norm).includes(a);s=known&&!same?10:5;st=known?'ok':'unk';}
    inp.disabled=true;inp.className=st==='ok'?'correct':st==='unk'?'same':(a?'wrong':'');
    pts+=s;rows.push({c,a,s,st,b:bots.map(b=>b.a[i])});
  });
  const all=valids===vis&&vis>0,bonus=all?Math.floor(left/6):0;
  pts+=bonus;G.me+=pts;
  bots.forEach((b,bi)=>{let t=0;rows.forEach((r,ri)=>{const ba=b.a[Object.keys(b.a)[ri]];if(ba)t+=(valid(r.a,L)&&norm(ba)===r.a)?5:10;});G.bot[bi]+=t;});
  if(all){P.perfect++;if(left>=30)P.speed++;SFX.win();}else SFX.ok();
  saveP();checkAch();
  setTimeout(()=>modal(`<h3>${all?'🌟 دور کامل!':'نتیجهٔ دور '+fa(G.round)}</h3>
    ${rows.map(r=>`<div class="res-row"><div><b>${esc(r.c)}</b>: ${esc(r.a)||'—'}<small>${BOTS.map((n,bi)=>n.split(' ')[0]+': '+(r.b[bi]||'—')).join(' · ')}</small></div><span class="pts">${r.st==='unk'?'❔ ':''}${fa(r.s)}</span></div>`).join('')}
    ${bonus?`<div class="res-row"><b>⚡ پاداش سرعت</b><span class="pts">+${fa(bonus)}</span></div>`:''}
    <div style="font-size:1.3rem;font-weight:900;margin:12px 0">امتیاز دور: <span class="pts">${fa(pts)}</span></div>
    <div class="mut" style="margin-bottom:10px">❔ = کلمه‌ای که در دیکشنری من نبود (۵ امتیاز)</div>
    <button class="btn teal block" onclick="nextSolo()">${G.round>=G.total?'نتیجهٔ نهایی ➡️':'دور بعدی ➡️'}</button>`),700);
}

/* ---- room listener ---- */
function onRoom(snap){
  const room=snap.val();
  if(!room){toast('اتاق بسته شد');return exitRoom();}
  R=room;
  if(!R.players||!R.players[P.id]){toast('از اتاق خارج شدی');return exitRoom();}
  // host migration
  const hp=R.players[R.host];
  if(!hp||hp.on===false){
    const cand=Object.entries(R.players).filter(([,p])=>p.on!==false).sort((a,b)=>(a[1].j||0)-(b[1].j||0))[0];
    if(cand&&cand[0]===P.id)roomRef.update({host:P.id});
  }
  const st=R.status,key=st+'|'+R.round+'|'+R.gid;
  if(st==='lobby'){
    if(viewKey!=='lobby'){viewKey='lobby';G=null;}
    show('room');renderRoom();

    if(viewKey!==key){viewKey=key;initOnlineRound();}else updGameBanner();
  }else if(st==='review'||st==='results'){
    if(G)G.active=false;viewKey=key+st;show('board');drawBoard();
  }else if(st==='finished'){
    if(viewKey!=='fin'){viewKey='fin';finishOnline();}else drawFinalOnline();
  }
}

/* ---- scoring ---- */
function computeRound(room,rej){
  const cats=catsOf(room),L=room.letter,ans=(room.answers||{})['r'+room.round]||{},pids=Object.keys(room.players||{}),out={};
  pids.forEach(p=>out[p]={t:0});
  cats.forEach((_,i)=>{
    const get=p=>rej[p+'_'+i]?'':((ans[p]||{})['c'+i]||''),cnt={};
    pids.forEach(p=>{const v=get(p);if(valid(v,L)){const n=norm(v);cnt[n]=(cnt[n]||0)+1;}});
    pids.forEach(p=>{const v=get(p);let pt=0;if(valid(v,L))pt=cnt[norm(v)]===1?10:5;out[p]['c'+i]=pt;out[p].t+=pt;});
  });
  return out;
}
function calcRejected(room){
  const votes=(room.votes||{})['r'+room.round]||{},n=Object.keys(room.players||{}).length,cnt={},rej={};
  Object.entries(votes).forEach(([voter,vs])=>Object.keys(vs).forEach(k=>{if(k==='_d'||k.startsWith(voter+'_'))return;cnt[k]=(cnt[k]||0)+1;}));
  Object.entries(cnt).forEach(([k,c])=>{if(c*2>n-1)rej[k]=1;});
  return rej;
}
function totalsOf(room){
  const t={};Object.keys(room.players||{}).forEach(p=>t[p]=0);
  Object.values(room.scores||{}).forEach(s=>Object.entries(s).forEach(([p,v])=>{if(p in t)t[p]+=v.t||0;}));
  return t;
}

/* ---- host loop ---- */
setInterval(()=>{
  if(!R||!roomRef||R.host!==P.id)return;
  const st=R.status,base=st+'|'+R.round+'|'+R.gid;
  if(st==='playing'){
    const end=Math.min(R.endsAt,R.stopAt||Infinity),ans=(R.answers||{})['r'+R.round]||{};
    const online=Object.values(R.players).filter(p=>p.on!==false).length;
    if((Object.keys(ans).length>=online||now()>end+4000)&&lock!==base){
      lock=base;roomRef.update({status:'review',reviewEnds:now()+20000,['scores/r'+R.round]:computeRound(R,{})});
    }
  }else if(st==='review'){
    const votes=(R.votes||{})['r'+R.round]||{};
    const ids=Object.entries(R.players).filter(([,p])=>p.on!==false).map(([id])=>id);
    const done=ids.every(id=>votes[id]&&votes[id]._d);
    if((done||now()>R.reviewEnds)&&lock!==base){
      lock=base;const rej=calcRejected(R);
      roomRef.update({status:'results',['scores/r'+R.round]:computeRound(R,rej),['rej/r'+R.round]:Object.keys(rej).length?rej:null});
    }
  }
},500);

/* ---- board (review + results) ---- */
function toggleFlag(pid,i){
  const k=pid+'_'+i,my=((R.votes||{})['r'+R.round]||{})[P.id]||{};
  roomRef.child('votes/r'+R.round+'/'+P.id+'/'+k).set(my[k]?null:1);SFX.click();
}
function confirmReview(){roomRef.child('votes/r'+R.round+'/'+P.id+'/_d').set(1);}
function hostNext(){if(R.round>=R.total)roomRef.update({status:'finished'});else startOnlineRound();}
function drawBoard(){
  const r=R,cats=catsOf(r),pids=Object.keys(r.players),ans=(r.answers||{})['r'+r.round]||{},sc=(r.scores||{})['r'+r.round]||{},rej=(r.rej||{})['r'+r.round]||{};
  const review=r.status==='review',votes=(r.votes||{})['r'+r.round]||{},my=votes[P.id]||{},done=!!my._d;
  const tot=totalsOf(r),order=[...pids].sort((a,b)=>tot[b]-tot[a]),host=r.host===P.id;
  let h=`<div class="game-header"><div style="font-weight:900">دور ${fa(r.round)}/${fa(r.total)}</div><div class="game-letter">${r.letter}</div><div class="game-timer" id="bTimer">${review?'--':'✓'}</div></div>`;
  if(review)h+=`<div class="hint-box">جواب نادرست دیدی؟ روی 🚩 بزن تا اعتراض ثبت بشه. با رأی اکثریت، جواب رد می‌شه.</div>`;
  cats.forEach((c,i)=>{
    h+=`<div class="cat-card"><div class="cat-title">${CATEMO[c]||'📌'} ${esc(c)}</div>`+pids.map(p=>{
      const a=(ans[p]||{})['c'+i]||'',pt=(sc[p]||{})['c'+i]||0,isRej=!!rej[p+'_'+i];
      return `<div class="ans-row ${isRej?'rej':''}"><span class="an">${esc(nameOfP(p))}${p===P.id?' (تو)':''}</span><span class="av">${esc(a)||'—'}${isRej?' ⛔':''}</span><span class="ap ${pt?'':'z'}">${fa(pt)}</span>${review&&p!==P.id&&a?`<button class="flag ${my[p+'_'+i]?'on':''}" onclick="toggleFlag('${p}',${i})">🚩</button>`:''}</div>`;
    }).join('')+'</div>';
  });
  h+=`<div class="online-card"><div class="section-title">🏅 امتیاز کل</div>${order.map((p,i)=>`<div class="rank ${i===0?'first':''}"><span>${fa(i+1)}</span><span>${esc(r.players[p].e||'😎')}</span><span>${esc(r.players[p].n)}</span><span class="mut">+${fa((sc[p]||{}).t||0)}</span><b>${fa(tot[p])}</b></div>`).join('')}</div>`;
  if(review)h+=`<button class="btn teal block" ${done?'disabled':''} onclick="confirmReview()">${done?'⏳ منتظر بقیه...':'✓ تایید و ادامه'}</button>`;
  else h+=host?`<button class="btn coral block" onclick="hostNext()">${r.round>=r.total?'🏁 نتیجهٔ نهایی':'➡️ دور بعدی'}</button>`:'<div class="wait">منتظر میزبان...</div>';
  $('#p-board').innerHTML=h;
}

/* ---- final ---- */
function finalList(){
  const tot=totalsOf(R);
  return Object.keys(R.players).sort((a,b)=>tot[b]-tot[a]).map(id=>({n:R.players[id].n,e:R.players[id].e,s:tot[id],me:id===P.id,id}));
}
function drawFinalOnline(){
  const list=finalList();
  drawFinal({list,win:list[0]&&list[0].me&&list[0].s>0,coins:G&&G.coins!=null?G.coins:null,solo:false});
}
function finishOnline(){
  const list=finalList(),me=list.find(x=>x.me),win=list.length>1&&list[0].id===P.id&&list[0].s>0&&(!list[1]||list[1].s<list[0].s);
  const key=RC+':'+R.gid;let coins=null;
  if(localStorage.getItem(LS('counted'))!==key){
    localStorage.setItem(LS('counted'),key);
    coins=applyStats({score:me?me.s:0,win,online:true});
  }
  G={mode:'online',active:false,coins};
  drawFinalOnline();show('final');
  if(win){confetti();SFX.win();}
}
function resetRoom(){
  if(!R||R.host!==P.id)return;
  roomRef.update({status:'lobby',round:0,used:'',answers:null,scores:null,votes:null,rej:null,stopAt:null,stopBy:null,reviewEnds:null});
}
/* ================= INIT ================= */
(function init(){
  applyTheme();
  const q=new URLSearchParams(location.search).get('room');
  if(q){pendingJoin=q.toUpperCase().slice(0,6);history.replaceState(null,'',location.pathname);}
  initFirebase();
  history.replaceState({p:'home'},'');
  if(pendingJoin)go('online',false);else go('home',false);
  if(FIRST_RUN){saveP();firstRun();}
})();
</script>
